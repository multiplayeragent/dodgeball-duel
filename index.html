<title>Dodgeball Duel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1d1430; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff6ec; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  [hidden] { display: none !important; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000c; left: 0; right: 0; text-align: center; }
  #score { top: max(8px, env(safe-area-inset-top)); display: flex; justify-content: center; align-items: center; gap: 8px; }

  #score .t0 { background: #e8434f; } #score .t1 { background: #3577e6; flex-direction: row-reverse; }

  #msg { top: 42%; transform: translateY(-50%); font: 900 min(14vw, 80px)/1 system-ui, sans-serif; letter-spacing: .03em; -webkit-text-stroke: 2px #1d1430; opacity: 0; transition: opacity .2s, transform .25s; }
  #msg small { display: block; margin-top: 8px; font-size: 18px; font-weight: 700; letter-spacing: 0; -webkit-text-stroke: 0; }
  #msg.on { opacity: 1; transform: translateY(-50%) scale(1.06); }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); font-size: 12px; opacity: .75; }
  #pad { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 22px); width: 190px; height: 110px; touch-action: none; }
  #pad button { position: absolute; border-radius: 50%; border: 3px solid #ffffffc0; background: #1d143099; color: #fff; font: 900 14px system-ui, sans-serif; touch-action: none; padding: 0; }
  #pad button.on { background: #ffffffaa; color: #1d1430; }

  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 22px; border-radius: 16px; background: #2a1d45; border: 1px solid #ffffff22; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 27px; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffb21e; text-align: left; }
  .card ol { text-align: left; margin: 0; padding-left: 26px; font-size: 14px; min-height: 22px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffb21e; font-weight: 700; }
  .card p { margin: 8px 0 0; font-size: 13px; opacity: .8; }

  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ffb21e; color: #2a1600; font: 800 17px system-ui, sans-serif; cursor: pointer; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>

<body>
<canvas id="game"></canvas>
<div class="hud" id="score"><span class="t t0" id="s0"></span><span id="clock"></span><span class="t t1" id="s1"></span></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="net">Connecting…</div>
<div id="pad" hidden><button id="bThrow">THROW</button><button id="bCatch">CATCH</button></div>
<div id="over" hidden><div class="card">
  <h2 id="winner"></h2><div id="final"></div>
  <h3>Most outs this match</h3><ol id="outs"></ol>
  <h3>Most outs ever</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ DODGEBALL DUEL · a Multiplayer Agent starter ════════════════════════════════════
 * Two teams, one line, five balls. Rush the middle, grab a ball, throw it. Get hit and you're out
 * to the bench; press Catch just as a ball reaches you and the THROWER is out instead. Last team
 * standing wins the round; first to three rounds wins the match.
 * Versus, 2–10 players on two teams; bots fill every empty spot, so it's always at least 4 v 4.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ team size, rounds, court size, running, throwing, catching, the bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   COURT ......... sizes, each team's half, start spots, the bench
 *   BALLS ......... rolling balls, balls in flight, picking up, throwing, aiming
 *   MATCH (HOST) .. teams, rounds, who is out, the winner, the balls. Only the host writes these.
 *   BOTS .......... the bot brain: grab a ball, line up a throw, dodge (or catch) incoming balls
 *   ME ............ running, picking up, throwing, catching, getting hit
 *   DRAW .......... the court seen from YOUR side (your team on the left, or at the bottom on a phone)
 *   HUD & RESULTS . scoreboard, messages, results card, leaderboard
 *   INPUT ......... keyboard + mouse (aim), and a thumb stick + Throw / Catch buttons on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player runs its OWN player on its own screen and writes it to its entity: `p`
 *     {x, y, f, ck, o, by} (f = facing, ck = catching, o = the round it got out in, by = who got it)
 *     about 15 times a second, `hb` (heartbeat) once a second, `rdy` (Play again), `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. The balls are shared, so the host owns them. Only the host writes the shared fields:
 *       `game`  {id, v, phase, round, teams, wins, startAt, endsAt, outs, kills, roundWin, resumeAt, win, overAt}:
 *               who plays (sessionIds or bots "b1".."b9"), who is out this round (`outs` {id: who got them}),
 *               outs per player, rounds won, the clock (timestamps). `v` goes up on every write.
 *       `balls` [{i, x, y, vx, vy, o, t, l, n}]: every ball ~15 times a second (o = who holds it, l = 1 while
 *               it flies after a throw by `t`, n = that throw's number).
 *       `bots`  [{i, x, y, f, ck}]: the bots ~10 times a second.
 *   - Intents and events: "grab" {i} (my hand touched ball i: the host says yes by writing me as its holder),
 *     "throw" {i, x, y, vx, vy, n} (to everyone: every screen flies the ball at once; the host adopts it),
 *     "hit" {i, n, by} and "caught" {i, n, by}.
 *   - A THROWN BALL IS DECIDED BY THE ONE IT REACHES (like a dodge): only you check balls against yourself.
 *     Catching at that moment, you send "caught" and the thrower is out; otherwise you're out: your `p.o`
 *     says so, and you send "hit". The host decides it for bots, and writes every out into `game.outs`.
 *   - Someone who joins takes a bot's spot (out if the bot was out); someone who leaves is replaced by a bot.
 *     A new host adopts `game`, `balls` and `bots` and carries on.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "dodge-outs": every player you get out (a hit or a catch) adds 1 to your total.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  teamSize: 4,          // players per team; bots fill the spots people don't
  maxTeam: 5,           // the most per team (10 in all)
  roundsToWin: 3,       // rounds a team needs to win the match
  roundMs: 75000,       // round clock; when it runs out the team with more players in wins the round
  startMs: 2400,        // ms on the back line before the rush (3, 2, 1, GO)
  roundOverMs: 3000,    // ms between rounds
  resultsMs: 10000,     // ms on the results card before the next match
  courtL: 1100, courtW: 620, // the court, in court units: x along it (the middle line at x = 0), y across
  balls: 5,
  playerR: 18, ballR: 11,
  run: 300,             // running speed, units/s
  accel: 2400,          // how snappy running is
  reach: 10,            // how far past your body you can scoop a ball
  throwSpeed: 780,      // a thrown ball's speed, units/s...
  liveMs: 1150,         // ...and how long it flies before it's just a rolling ball
  ballFriction: 1.8,    // how fast a rolling ball slows
  wallBounce: 0.6,
  catchMs: 320,         // how long one press of Catch is open...
  catchEvery: 850,      // ...and how often you can press it
  catchSlow: 0.45,      // share of your speed while catching
  aimAssist: 1.0,       // auto-aim picks a target within this angle (radians) of where you face
  botSpeed: 0.82,       // bots run at this share of your speed
  botThink: 220,        // ms between bot decisions
  botError: 55,         // how far off bots aim, units
  botWait: 900,         // ms (roughly) a bot holds a ball before throwing
  botCatch: 0.28,       // chance a bot tries to catch a ball coming at it (otherwise it dodges)
  botDodge: 0.7,        // chance a bot notices a ball coming at it at all
  sendMs: 66,           // my player and the balls (~15 a second)
  botsMs: 100,          // the bots (~10 a second)
  board: "dodge-outs",
};
const TEAM_COLORS = ["#e8434f", "#3577e6"], TEAM_DARK = ["#7a1620", "#163c7c"], TEAM_NAMES = ["Red", "Blue"];
const COLORS = ["#ffd166", "#ffffff", "#7cf2c9", "#c7a2ff", "#ff9f43", "#ff8fd0", "#a6f26b", "#7fe3ff"]; // each person's own color (their head)
const BOT_NAMES = ["", "Dodger", "Zinger", "Whip", "Duck", "Rocket", "Slider", "Bouncer", "Noodle", "Ace"]; // bot "b3" is Whip

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'dodgeball-duel',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch

// ── COURT ───────────────────────────────────────────────────────────────────────────
// Court units: x runs -HL..HL along the court, y runs -HW..HW across. Red (team 0) plays in x < 0, Blue in x > 0.
const HL = CONFIG.courtL / 2, HW = CONFIG.courtW / 2, PR = CONFIG.playerR, BR = CONFIG.ballR;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));
/** Keep a player inside its own half. */
function keepInHalf(p, team) {
  p.x = team === 0 ? clamp(p.x, -HL + PR, -PR - 2) : clamp(p.x, PR + 2, HL - PR);
  p.y = clamp(p.y, -HW + PR, HW - PR);
}
/** Start spots on the back line, spread across it. */
function spotOf(team, i, size) { const f = team === 0 ? -1 : 1; return { x: f * (HL - 70), y: (size > 1 ? (i / (size - 1) - 0.5) : 0) * (HW * 1.5), f: team === 0 ? 0 : Math.PI }; }
/** Where out players sit: a bench outside the court, along the near side of their own half. */
function benchSpot(team, k) { const f = team === 0 ? -1 : 1; return { x: f * (110 + k * 46), y: HW + 52, f: -Math.PI / 2 }; }
const ballSpot = (i) => ({ x: 0, y: (i / (CONFIG.balls - 1) - 0.5) * HW * 1.4 }); // the balls start on the middle line

// ── BALLS ───────────────────────────────────────────────────────────────────────────
/** Roll a loose ball, or fly a live one, dt seconds; walls bounce. Returns true if it hit a wall. */
function stepBall(b, dt) {
  b.x += b.vx * dt; b.y += b.vy * dt;
  let wall = false;
  if (Math.abs(b.x) > HL - BR) { b.x = Math.sign(b.x) * (HL - BR); b.vx = -b.vx * CONFIG.wallBounce; wall = true; }
  if (Math.abs(b.y) > HW - BR) { b.y = Math.sign(b.y) * (HW - BR); b.vy = -b.vy * CONFIG.wallBounce; wall = true; }
  if (!b.l) { const f = Math.exp(-CONFIG.ballFriction * dt); b.vx *= f; b.vy *= f; if (Math.abs(b.vx) + Math.abs(b.vy) < 4) b.vx = b.vy = 0; }
  return wall;
}
/** A ball stops flying (it hit a wall, a player, or ran out of steam) and rolls on slowly. */
function deaden(b, bounce) { b.l = 0; b.t = ""; if (bounce) { b.vx = -b.vx * 0.25 + (Math.random() - 0.5) * 140; b.vy = -b.vy * 0.25 + (Math.random() - 0.5) * 140; } else { b.vx *= 0.35; b.vy *= 0.35; } }
const handOf = (p) => ({ x: p.x + Math.cos(p.f) * (PR + 6), y: p.y + Math.sin(p.f) * (PR + 6) });
/** Can player p scoop up loose ball b? */
const canScoop = (p, b) => !b.o && !b.l && Math.hypot(b.x - p.x, b.y - p.y) < PR + BR + CONFIG.reach;
/** Does a flying ball at (x, y) touch player p? */
const touches = (x, y, p) => Math.hypot(x - p.x, y - p.y) < PR + BR;
/** The direction to throw from player p (team `team`): at `aim` if given, else at the opponent nearest where p faces, led a little. */
function throwDir(p, team, g, aim) {
  if (aim) return Math.atan2(aim.y - p.y, aim.x - p.x);
  let best = null, bestA = CONFIG.aimAssist;
  for (const id of g.teams[1 - team]) {
    const o = bodyOf(id); if (!o || !inGame(g, id)) continue;
    const a = Math.abs(wrapA(Math.atan2(o.y - p.y, o.x - p.x) - p.f)); if (a < bestA) { bestA = a; best = o; }
  }
  if (!best) return p.f;
  const T = Math.hypot(best.x - p.x, best.y - p.y) / CONFIG.throwSpeed;
  return Math.atan2(best.y + (best.vy || 0) * T - p.y, best.x + (best.vx || 0) * T - p.x);
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, bots: new Map(), lastBalls: 0, lastBots: 0, lastBody: "", balls: [] };
const isBot = (id) => /^b\d$/.test(id);
const teamOf = (g, id) => (g.teams[0].includes(id) ? 0 : g.teams[1].includes(id) ? 1 : -1);
const roundKey = (g) => `${g.id}:${g.round}`;
/** Is `id` still in this round (not out)? People's own entities say so at once; the host's `outs` say so for everyone. */
function inGame(g, id) {
  if ((g.outs || {})[id] !== undefined) return false;
  if (id === net.sessionId) return me.out !== roundKey(g);
  return isBot(id) || (S.entities.players[id] || {}).o !== roundKey(g);
}
/** The game as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = cached("game", S.shared.game, null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const teamSize = (people) => clamp(Math.ceil(people / 2), CONFIG.teamSize, CONFIG.maxTeam);
/** Fill gaps (null) and both teams up to `size` with bots; drop spare bots. */
function fillBots(teams, size) {
  const used = new Set(teams.flat());
  const newBot = () => { let k = 1; while (used.has("b" + k)) k++; used.add("b" + k); return "b" + k; };
  return teams.map((t) => {
    t = t.map((id) => id || newBot());
    for (let i = t.length - 1; i >= 0 && t.length > size; i--) if (isBot(t[i])) t.splice(i, 1);
    while (t.length < size) t.push(newBot());
    return t;
  });
}
/** Everyone still here keeps their spot; a newcomer takes a bot's spot (and its out, if it was out) on the team with fewer people. */
function arrangeTeams(g, people) {
  const size = teamSize(people.length), t = g.teams.map((team) => team.map((id) => (isBot(id) || people.includes(id) ? id : null)));
  const outs = { ...g.outs }, count = (k) => t[k].filter((id) => id && !isBot(id)).length;
  for (const id of people) {
    if (t[0].includes(id) || t[1].includes(id)) continue;
    const k = count(0) <= count(1) ? 0 : 1;
    if (count(k) >= size) continue; // every spot has a person in it: this one watches
    let i = t[k].indexOf(null); if (i < 0) i = t[k].findIndex(isBot);
    if (i < 0) t[k].push(id); else { if (outs[t[k][i]] !== undefined) outs[id] = outs[t[k][i]]; t[k][i] = id; }
  }
  return { teams: fillBots(t, size), outs };
}
/** A round starts: everyone on the back line, the balls on the middle line, nobody out. */
function newRound(g, round, t) {
  const startAt = t + CONFIG.startMs + 600;
  host.balls = Array.from({ length: CONFIG.balls }, (_, i) => ({ i, ...ballSpot(i), vx: 0, vy: 0, o: "", t: "", l: 0, n: 0 }));
  for (const b of host.bots.values()) { const k = teamOf(g, b.id); if (k >= 0) Object.assign(b, spotOf(k, g.teams[k].indexOf(b.id), g.teams[k].length), { vx: 0, vy: 0, ck: 0, ckCd: 0, holdAt: 0 }); }
  g = writeGame({ ...g, phase: "play", round, startAt, endsAt: startAt + CONFIG.roundMs, outs: {}, roundWin: -1 });
  writeBalls(); writeBots();
  return g;
}
function newGame(id) {
  const people = humans().sort(() => Math.random() - 0.5), teams = [[], []];
  people.forEach((p, i) => teams[i % 2].push(p));
  return { id, phase: "play", round: 1, teams: fillBots(teams, teamSize(people.length)), wins: [0, 0], startAt: 0, endsAt: 0, outs: {}, kills: {}, roundWin: -1, resumeAt: 0, win: -1, overAt: 0 };
}
function writeBalls(onlyIfMoved) {
  const r = Math.round, body = JSON.stringify(host.balls.map((b) => ({ i: b.i, x: r(b.x), y: r(b.y), vx: r(b.vx), vy: r(b.vy), o: b.o, t: b.t, l: b.l, n: b.n })));
  host.lastBalls = performance.now();
  if (onlyIfMoved && body === host.lastBody) return; // nothing moved: save the message
  host.lastBody = body; net.setShared("balls", body);
}
const pWire = (p, now) => ({ x: Math.round(p.x), y: Math.round(p.y), f: +p.f.toFixed(2), ck: p.ck > now ? 1 : 0 });
function writeBots() { const now = performance.now(); host.lastBots = now; net.setShared("bots", JSON.stringify([...host.bots.values()].map((b) => ({ i: b.id, ...pWire(b, now) })))); }
const newBot = (id, s) => ({ id, x: s.x, y: s.y, f: s.f, vx: 0, vy: 0, ck: 0, ckCd: 0, thinkAt: 0, tx: s.x, ty: s.y, holdAt: 0, ex: 0, ey: 0 });
/** Become host: take over the game, the balls and the bots exactly as state has them (bots from where this screen drew them). */
function adopt() {
  host.wasHost = true; host.bots.clear();
  host.balls = (parse(S.shared.balls, []) || []).map((b) => { const f = flights.get(b.i); return f && f.n === b.n && b.l ? { ...b, x: f.x, y: f.y, until: f.until } : { ...b, until: performance.now() + CONFIG.liveMs * 0.5 }; });
  for (const q of parse(S.shared.bots, [])) { const v = views.get(q.i) || q; host.bots.set(q.i, newBot(q.i, { x: v.x, y: v.y, f: v.f })); }
}
/** host.bots holds exactly the bots on the teams. */
function syncBots(g) {
  for (const id of g.teams.flat()) if (isBot(id) && !host.bots.has(id)) { const k = teamOf(g, id); host.bots.set(id, newBot(id, spotOf(k, g.teams[k].indexOf(id), g.teams[k].length))); }

cv.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") mouse = { x: e.clientX, y: e.clientY, at: performance.now() }; if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (joy && e.pointerId === joy.id) joy = null; });
$("pad").hidden = !touchUI;
for (const [id, down] of [["bThrow", () => (act.throw = true)], ["bCatch", () => (act.catch = true)]]) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); b.setPointerCapture(e.pointerId); b.classList.add("on"); down(); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => b.classList.remove("on"));
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the match meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncViews(dt);
  if (isHost()) { botCatchCheck(now); hostTick(dt, now); } else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(dt, g, now);
    draw(g, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("grab", (msg, from) => { if (isHost() && msg) applyGrab(msg, from); });
  net.on("throw", (msg, from) => {
    if (!msg) return;
    if (isHost()) applyThrow(msg, from);
    else if (from !== net.sessionId) { flights.set(+msg.i, { i: +msg.i, n: +msg.n, x: +msg.x, y: +msg.y, vx: +msg.vx, vy: +msg.vy, by: from, until: performance.now() + CONFIG.liveMs }); throwFx(+msg.x, +msg.y); }
  });
  net.on("hit", (msg, from) => { if (isHost() && msg) applyHitOrCatch(msg, from, false); });
  net.on("caught", (msg, from) => { if (!msg) return; if (isHost()) applyHitOrCatch(msg, from, true); else { const f = flights.get(+msg.i); if (f) f.done = f.n; const p = bodyOf(from); if (p) catchFx(p.x, p.y); } });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { startMs: 600, roundOverMs: 1600, botWait: 350, botSpeed: 0.95, roundsToWin: 99 });
  requestAnimationFrame(frame);
})();
</script>
